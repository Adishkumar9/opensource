<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle Block</title>
  <style>
    /* Set the popup dimensions */
    body {
      width: 400px;
      height: 300px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4a90e2, #50e3c2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin: 0;
    }

    /* Container styling */
    #container {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 80%;
      max-width: 350px;
      text-align: center;
    }

    #siteInput {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      outline: none;
      transition: box-shadow 0.3s ease-in-out;
    }

    #siteInput:focus {
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    #blockButton {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(90deg, #ff6a00, #ffbc00);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    #blockButton:hover {
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transform: translateY(-2px);
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.5s;
    }

    #status.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="container">
    <input type="text" id="siteInput" placeholder="Enter website URL">
    <button id="blockButton">Toggle Block</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
